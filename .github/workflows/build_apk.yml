name: Build Release APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode Android Keystore & Create key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat <<EOF > android/key.properties
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build split-per-abi release APKs
        run: flutter build apk --release --split-per-abi

      - name: Rename release APKs
        run: |
          REF="${GITHUB_REF_NAME}"
          DIR="build/app/outputs/flutter-apk"
          mv "$DIR/app-arm64-v8a-release.apk" "$DIR/SayadGanj-${REF}-arm64-v8a.apk"
          mv "$DIR/app-armeabi-v7a-release.apk" "$DIR/SayadGanj-${REF}-armeabi-v7a.apk"
          mv "$DIR/app-x86_64-release.apk" "$DIR/SayadGanj-${REF}-x86_64.apk"

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sayadganj-release-apks
          path: build/app/outputs/flutter-apk/SayadGanj-*.apk
          retention-days: 30

      - name: Publish GitHub Release (on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              build/app/outputs/flutter-apk/SayadGanj-*.apk \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              build/app/outputs/flutter-apk/SayadGanj-*.apk \
              --title "SayadGanj ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
