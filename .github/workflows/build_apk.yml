name: Build Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract version from pubspec.yaml
        id: version
        run: |
          RAW_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr -d '\r')
          SEMVER="${RAW_VERSION%%+*}"
          TAG="v${SEMVER}"
          echo "raw=$RAW_VERSION" >> "$GITHUB_OUTPUT"
          echo "semver=$SEMVER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "is_new_version=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_new_version=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode Android Keystore & Create key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat <<EOF > android/key.properties
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build split-per-abi release APKs
        run: flutter build apk --release --split-per-abi

      - name: Rename release APKs
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          DIR="build/app/outputs/flutter-apk"
          mv "$DIR/app-arm64-v8a-release.apk" "$DIR/SayadGanj-${TAG}-arm64-v8a.apk"
          mv "$DIR/app-armeabi-v7a-release.apk" "$DIR/SayadGanj-${TAG}-armeabi-v7a.apk"
          mv "$DIR/app-x86_64-release.apk" "$DIR/SayadGanj-${TAG}-x86_64.apk"

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sayadganj-release-apks-${{ steps.version.outputs.tag }}
          path: build/app/outputs/flutter-apk/SayadGanj-*.apk
          retention-days: 30

      - name: Create Tag & Publish GitHub Release
        if: steps.version.outputs.is_new_version == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          gh release create "$TAG" \
            build/app/outputs/flutter-apk/SayadGanj-*.apk \
            --target "${{ github.sha }}" \
            --title "SayadGanj $TAG" \
            --generate-notes