name: sayadganj
description: "An offline-first Balochi-to-Balochi dictionary mobile application built with Flutter, bringing Sayad Hashumi's landmark lexicographical work into a fast, modern, and accessible reading experience."
publish_to: "none"
version: 1.3.3+6

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  material_ui: ^1.1.0
  flutter_riverpod: ^3.5.0
  sqflite: ^2.4.6
  path: ^1.9.1
  path_provider: ^2.1.6
  lucide_icons_flutter: ^4.0.3
  google_nav_bar: ^5.0.7
  flutter_animate: ^4.5.2
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  carousel_slider: ^5.1.2
  url_launcher: ^6.3.3
  flutter_local_notifications: ^23.0.3
  timezone: ^0.11.2
  flutter_launcher_icons: ^0.14.4
  package_info_plus: ^10.2.2
  cupertino_ui: ^1.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/db/
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
    - family: DroshumBalochi
      fonts:
        - asset: assets/fonts/DroshumBalochi.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0B132B"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  remove_alpha_ios: true
